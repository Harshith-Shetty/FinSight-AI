# Create a separate Azure pipeline for each entry file. See deploy/README.md.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - app/core/**
      - app/models/**
      - app/services/**
      - app/__init__.py
      - alembic/**
      - alembic.ini
      - requirements.txt
      - Dockerfile
      - .dockerignore
      - deploy/**
      - tests/**
      - app/worker/**
      - azure-pipelines-worker.yml
pr: none
parameters:
  - name: dockerHubRepository
    type: string
    default: harshithdshetty/finsight-worker
extends:
  template: deploy/pipeline.yml
  parameters:
    serviceName: worker
    dockerHubRepository: ${{ parameters.dockerHubRepository }}
