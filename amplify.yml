version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd finsight-frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: finsight-frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - finsight-frontend/node_modules/**/*
