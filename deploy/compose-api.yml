services:
  api:
    image: ${SERVICE_IMAGE:?Set SERVICE_IMAGE}
    container_name: finsight-api
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: ./app.env
        format: raw
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    networks:
      - finsight-prod-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  uploads_data:
    external: true
    name: ${UPLOADS_VOLUME:?Use the existing production uploads volume}
networks:
  finsight-prod-network:
    driver: bridge
