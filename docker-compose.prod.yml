version: '3.8'

services:
  api:
    build: .
    container_name: finsight-api
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - finsight-prod-network

  worker:
    build: .
    container_name: finsight-worker
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=solo
    env_file: .env
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - finsight-prod-network

networks:
  finsight-prod-network:
    driver: bridge
